# Use H2 for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate configuration for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Liquibase for tests
spring.liquibase.enabled=false

# Disable JCache/Ehcache for tests (use simple cache)
spring.cache.type=simple

# Override other production settings
simpleaccounts.filelocation=target/test-uploads/
simpleaccounts.migration.pathlocation=target/test-migration-uploads/

# JWT Secret for testing (at least 64 bytes for HS512)
jwt.secret=testSecretKeyForTestingOnly1234567890testSecretKeyForTestingOnly1234567890
