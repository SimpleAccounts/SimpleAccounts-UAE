spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SIMPLEACCOUNTS_DB_HOST}:${SIMPLEACCOUNTS_DB_PORT}/${SIMPLEACCOUNTS_DB}?autoReconnect=true&useUnicode=true&createDatabaseIfNotExist=true&characterEncoding=utf-8&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=${SIMPLEACCOUNTS_DB_USER}
spring.datasource.password=${SIMPLEACCOUNTS_DB_PASSWORD}
# Enable SSL
spring.datasource.ssl=${SIMPLEACCOUNTS_DB_SSL}
# Set SSL mode
spring.datasource.sslmode=${SIMPLEACCOUNTS_DB_SSLMODE}
# Provide the CA certificate file
spring.datasource.sslrootcert=${SIMPLEACCOUNTS_DB_SSLROOTCERT}

# JPA/Hibernate configuration for Spring Boot 3.4 and Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080
spring.jackson.serialization.fail-on-empty-beans=false
# Force eager initialization of DispatcherServlet
spring.mvc.servlet.load-on-startup=1
# Disable lazy initialization to ensure controllers are registered at startup
spring.main.lazy-initialization=false

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT Secret (must be at least 64 bytes for HS512)
jwt.secret=${JWT_SECRET:simpleaccounts1234567890simpleaccounts1234567890simpleaccounts1234567890}

# File locations
simpleaccounts.filelocation=upload/
simpleaccounts.migration.pathlocation=migrationuploadedfiles/
simpleaccounts.filelocation.linux=/usr/local/simpleaccounts_attchement/
simpleaccounts.baseUrl=${SIMPLEACCOUNTS_HOST:http://localhost:8080}

# Liquibase
spring.liquibase.change-log=classpath:liquibase/liquibase-changelog.xml

# Ehcache 3 (JCache) configuration for Spring Boot 3.4
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

# File Storage Properties
file.upload-dir=sample-file/

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=${java.io.tmpdir}
# Increase file/part count limit (default is 10 in Tomcat 10.1+ for security)
# Registration form has ~15 fields, each counts as a "part"
server.tomcat.max-parameter-count=100
server.tomcat.max-swallow-size=-1
server.tomcat.max-file-count=100
spring.servlet.multipart.strict-servlet-compliance=false

# SpringDoc OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.simpleaccounts.rest

# CORS configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}
