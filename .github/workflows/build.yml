# SimpleAccounts UAE - Build & Test Pipeline
# Comprehensive CI with unit tests, integration tests, and coverage reporting

name: SimpleAccounts CI

on:
  push:
    branches: ['develop', 'master']
  pull_request:
    branches: ['develop', 'master']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --openssl-legacy-provider
  SPRING_PROFILES_ACTIVE: test

jobs:
  lint-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v4
        with:
          node-version: 20.x

      - name: Cache dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-lint-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::Base commit $BASE_SHA not found; skipping formatting check."
            exit 0
          fi

          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::warning::Head commit $HEAD_SHA not found; skipping formatting check."
            exit 0
          fi

          # Exclude deleted files (--diff-filter=d) to avoid prettier errors on non-existent files
          git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" > /tmp/changed_files.txt

          grep -E '\.(js|jsx|ts|tsx|json|yml|yaml|md|css|scss)$' /tmp/changed_files.txt \
            | grep -v '^apps/backend/src/main/resources/MailTemplates/' \
            > /tmp/prettier_files.txt || true

          if [ ! -s /tmp/prettier_files.txt ]; then
            echo "No files to format-check."
            exit 0
          fi

          echo "Running Prettier check on:"
          cat /tmp/prettier_files.txt
          xargs -r -d $'\n' npx prettier --check < /tmp/prettier_files.txt

  # Stage 1: Lint and Unit Tests (fail-fast)
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests with Coverage
        working-directory: apps/backend
        run: mvn clean test -Dspring.profiles.active=test

      - name: Generate Coverage Report
        working-directory: apps/backend
        run: mvn jacoco:report
        if: always()

      - name: Upload Backend Test Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        if: always()
        with:
          name: backend-test-results
          path: |
            apps/backend/target/surefire-reports/
            apps/backend/target/site/jacoco/
          retention-days: 7

  test-frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Cache dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('package-lock.json', 'apps/frontend/package-lock.json') }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v4
        with:
          node-version: 20.x

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Unit Tests with Coverage
        working-directory: apps/frontend
        run: npm run test:cov
        env:
          CI: true

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        if: always()
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 7

  # Stage 2: Build (after tests pass)
  build-frontend:
    name: Build Frontend
    needs: test-frontend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Cache dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('package-lock.json', 'apps/frontend/package-lock.json') }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v4
        with:
          node-version: 20.x

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend with Vite
        working-directory: apps/frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: frontend-build
          path: apps/frontend/dist
          retention-days: 7

  build-backend:
    name: Build Backend
    needs: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: apps/backend
        run: mvn clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: backend-build
          path: apps/backend/target/*.war
          retention-days: 7

  # Stage 3: E2E Tests (nightly or manual)
  test-e2e:
    name: E2E Tests
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          cd apps/frontend && npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Environment Tests
        working-directory: apps/frontend
        run: npx playwright test environment.smoke.spec.ts --project=chromium

      - name: Upload E2E Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        if: always()
        with:
          name: e2e-results
          path: apps/frontend/test-results/
          retention-days: 7
