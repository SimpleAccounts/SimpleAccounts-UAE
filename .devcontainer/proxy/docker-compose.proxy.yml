# =============================================================================
# Reverse Proxy for Multi-User Development Environment
# =============================================================================
# This proxy enables multiple developers to share their dev environments.
#
# Installation (one-time, admin only):
#   sudo ./install-traefik-service.sh
#
# User environments are created automatically via DevPod.
# Each user's devcontainer auto-connects to this proxy on startup.
#
# URL Format (dev.simpleaccounts.io - valid SSL certificates):
#   - Frontend: https://<username>.dev.simpleaccounts.io
#   - Backend:  https://<username>-api.dev.simpleaccounts.io
#   - Web IDE:  https://<username>-ide.dev.simpleaccounts.io
#   - Dashboard: http://localhost:8090 (on server only)
#
# Example for user 'alice':
#   - https://alice.dev.simpleaccounts.io
#   - https://alice-api.dev.simpleaccounts.io
#   - https://alice-ide.dev.simpleaccounts.io
#
# =============================================================================

services:
  traefik:
    image: traefik:v2.11
    container_name: dev-proxy
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      # API and Dashboard
      - '--api.dashboard=true'
      - '--api.insecure=true'
      # Docker provider
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=dev-proxy-network'
      # Entrypoints
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      # NOTE: No global HTTP→HTTPS redirect - local domains use HTTP only
      # HTTPS is enforced by routers using websecure entrypoint
      # Let's Encrypt Certificate Resolver with Cloudflare DNS challenge
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53'
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@simpleaccounts.io}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      # Logs
      - '--log.level=INFO'
      - '--accesslog=true'
    ports:
      - '80:80'
      - '443:443'
      - '8090:8080' # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - dev-proxy-network
    labels:
      - 'traefik.enable=true'
      # Dashboard routing via nip.io (no DNS config needed)
      - 'traefik.http.routers.dashboard.rule=HostRegexp(`proxy.{ip:[0-9-]+}.nip.io`)'
      - 'traefik.http.routers.dashboard.entrypoints=web'
      - 'traefik.http.routers.dashboard.service=api@internal'
      # Dashboard routing via local domain (requires /etc/hosts or local DNS)
      - 'traefik.http.routers.dashboard-local.rule=Host(`proxy.dev.simpleaccounts.local`)'
      - 'traefik.http.routers.dashboard-local.entrypoints=web'
      - 'traefik.http.routers.dashboard-local.service=api@internal'

networks:
  dev-proxy-network:
    name: dev-proxy-network
    driver: bridge

volumes:
  letsencrypt:
    name: traefik-letsencrypt
