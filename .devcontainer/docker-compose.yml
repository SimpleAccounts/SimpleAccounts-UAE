# =============================================================================
# SimpleAccounts UAE - Development Container Stack
# =============================================================================
#
# Works for both LOCAL and DEV-SERVER:
#   - Local: Uses port forwarding via DevPod/VS Code
#   - Dev-Server: Auto-connects to Traefik for shareable URLs
#
# Network Architecture:
#   - All services share an internal network for communication
#   - Services communicate via hostnames: db:5432, redis:6379
#   - Devcontainer connects to Traefik network for external routing
#
# Credential Mounts:
#   - Local Docker: Copy .env.local to .env to mount from ~/.claude, ~/.ssh, etc.
#   - Remote SSH: Uses default ${HOME}/.devpod-mount/ for isolated credentials
#
# See .env.local for local Docker configuration
#
# =============================================================================

services:
  devcontainer:
    image: ghcr.io/simpleaccounts/simpleaccounts-uae-devcontainer:latest
    container_name: dev-${USER:-devuser}
    init: true # Use tini as PID 1 to properly reap zombie processes

    volumes:
      - ../:/workspaces/SimpleAccounts-UAE:cached
      # Cache volumes (project-prefixed by Docker Compose)
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      - maven-cache:/home/vscode/.m2
      - npm-cache:/home/vscode/.npm
      # User config/credentials
      # - Local Docker: Set DEVPOD_CREDENTIALS_LOCAL=true to use ~/.claude, ~/.ssh, etc.
      # - Remote SSH: Defaults to ${HOME}/.devpod-mount/ for isolated credentials
      - ${DEVPOD_CREDS_CLAUDE:-${HOME}/.devpod-mount/claude}:/home/vscode/.claude
      - ${DEVPOD_CREDS_GEMINI:-${HOME}/.devpod-mount/gemini}:/home/vscode/.gemini
      - ${DEVPOD_CREDS_CODEX:-${HOME}/.devpod-mount/codex}:/home/vscode/.codex
      - ${DEVPOD_CREDS_GH:-${HOME}/.devpod-mount/gh}:/home/vscode/.config/gh
      - ${DEVPOD_CREDS_SSH:-${HOME}/.devpod-mount/ssh}:/home/vscode/.ssh
      - ${DEVPOD_CREDS_DOCKER:-${HOME}/.devpod-mount/docker}:/home/vscode/.docker
      - ${DEVPOD_CREDS_KUBE:-${HOME}/.devpod-mount/kube}:/home/vscode/.kube
      - ${DEVPOD_CREDS_AWS:-${HOME}/.devpod-mount/aws}:/home/vscode/.aws
      - ${DEVPOD_CREDS_AZURE:-${HOME}/.devpod-mount/azure}:/home/vscode/.azure
      - ${DEVPOD_CREDS_CODESERVER:-${HOME}/.devpod-mount/code-server}:/home/vscode/.config/code-server
      - ${DEVPOD_CREDS_BASH:-${HOME}/.devpod-mount/bash-history}:/home/vscode/.bash_history_dir
      - ${DEVPOD_CREDS_GIT:-${HOME}/.devpod-mount/gitconfig}:/home/vscode/.gitconfig_dir
      # Mount host docker socket for Traefik network connection
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      - DEV_USER=${USER:-devuser}
      # Database connection (uses hostname 'db' on internal network)
      - SIMPLEACCOUNTS_DB_HOST=db
      - SIMPLEACCOUNTS_DB_PORT=5432
      - SIMPLEACCOUNTS_DB=simpleaccounts
      - SIMPLEACCOUNTS_DB_USER=simpleaccounts
      - SIMPLEACCOUNTS_DB_PASSWORD=simpleaccounts_dev
      - SIMPLEACCOUNTS_DB_SSL=false
      - SIMPLEACCOUNTS_DB_SSLMODE=disable
      # Redis connection (uses hostname 'redis' on internal network)
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    command: sleep infinity

    networks:
      - internal

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    # Traefik labels for external routing (active when connected to dev-proxy-network)
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dev-proxy-network'
      # ============= Frontend routing (port 3000) =============
      - 'traefik.http.routers.${USER:-devuser}-frontend.rule=Host(`${USER:-devuser}.dev.simpleaccounts.io`)'
      - 'traefik.http.routers.${USER:-devuser}-frontend.entrypoints=websecure'
      - 'traefik.http.routers.${USER:-devuser}-frontend.tls=true'
      - 'traefik.http.routers.${USER:-devuser}-frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.${USER:-devuser}-frontend.tls.domains[0].main=dev.simpleaccounts.io'
      - 'traefik.http.routers.${USER:-devuser}-frontend.tls.domains[0].sans=*.dev.simpleaccounts.io'
      - 'traefik.http.routers.${USER:-devuser}-frontend.service=${USER:-devuser}-frontend'
      - 'traefik.http.services.${USER:-devuser}-frontend.loadbalancer.server.port=3000'
      # ============= Backend API routing (port 8080) =============
      - 'traefik.http.routers.${USER:-devuser}-api.rule=Host(`${USER:-devuser}-api.dev.simpleaccounts.io`)'
      - 'traefik.http.routers.${USER:-devuser}-api.entrypoints=websecure'
      - 'traefik.http.routers.${USER:-devuser}-api.tls=true'
      - 'traefik.http.routers.${USER:-devuser}-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.${USER:-devuser}-api.service=${USER:-devuser}-api'
      - 'traefik.http.services.${USER:-devuser}-api.loadbalancer.server.port=8080'
      # ============= Code-server / Web IDE routing (port 8443) =============
      - 'traefik.http.routers.${USER:-devuser}-ide.rule=Host(`${USER:-devuser}-ide.dev.simpleaccounts.io`)'
      - 'traefik.http.routers.${USER:-devuser}-ide.entrypoints=websecure'
      - 'traefik.http.routers.${USER:-devuser}-ide.tls=true'
      - 'traefik.http.routers.${USER:-devuser}-ide.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.${USER:-devuser}-ide.service=${USER:-devuser}-ide'
      - 'traefik.http.services.${USER:-devuser}-ide.loadbalancer.server.port=8443'
      # ============= Local domain routing (HTTP only, no redirect) =============
      - 'traefik.http.routers.${USER:-devuser}-frontend-local.rule=Host(`${USER:-devuser}.dev.simpleaccounts.local`)'
      - 'traefik.http.routers.${USER:-devuser}-frontend-local.entrypoints=web'
      - 'traefik.http.routers.${USER:-devuser}-frontend-local.service=${USER:-devuser}-frontend'
      - 'traefik.http.routers.${USER:-devuser}-api-local.rule=Host(`${USER:-devuser}-api.dev.simpleaccounts.local`)'
      - 'traefik.http.routers.${USER:-devuser}-api-local.entrypoints=web'
      - 'traefik.http.routers.${USER:-devuser}-api-local.service=${USER:-devuser}-api'
      - 'traefik.http.routers.${USER:-devuser}-ide-local.rule=Host(`${USER:-devuser}-ide.dev.simpleaccounts.local`)'
      - 'traefik.http.routers.${USER:-devuser}-ide-local.entrypoints=web'
      - 'traefik.http.routers.${USER:-devuser}-ide-local.service=${USER:-devuser}-ide'

  db:
    image: postgres:18-alpine
    container_name: db-${USER:-devuser}
    hostname: db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: simpleaccounts
      POSTGRES_PASSWORD: simpleaccounts_dev
      POSTGRES_DB: simpleaccounts
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simpleaccounts']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: redis-${USER:-devuser}
    hostname: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - internal

networks:
  internal:
    name: ${USER:-devuser}-internal

volumes:
  postgres-data:
    name: ${USER:-devuser}-postgres-data
  redis-data:
    name: ${USER:-devuser}-redis-data
  vscode-extensions:
    name: ${USER:-devuser}-vscode-extensions
  maven-cache:
    name: ${USER:-devuser}-maven-cache
  npm-cache:
    name: ${USER:-devuser}-npm-cache
