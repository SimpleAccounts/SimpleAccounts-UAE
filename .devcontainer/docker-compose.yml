services:
  devcontainer:
    # Use prebuilt image (default for fast startup)
    image: ghcr.io/simpleaccounts/simpleaccounts-uae-devcontainer:latest
    # For local development/testing, comment out 'image:' above and uncomment below:
    # build:
    #   context: ..
    #   dockerfile: .devcontainer/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ../:/workspaces/SimpleAccounts-UAE:cached
      - devcontainer-vscode-extensions:/home/vscode/.vscode-server/extensions
      - devcontainer-maven-cache:/home/vscode/.m2
      - devcontainer-npm-cache:/home/vscode/.npm
      - devcontainer-claude-config:/home/vscode/.claude
      - devcontainer-gemini-config:/home/vscode/.gemini
      - devcontainer-codex-config:/home/vscode/.codex
      - devcontainer-gh-config:/home/vscode/.config/gh
    command: sleep infinity
    network_mode: service:db
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: simpleaccounts
      POSTGRES_PASSWORD: simpleaccounts_dev
      POSTGRES_DB: simpleaccounts
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simpleaccounts']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    network_mode: service:db

volumes:
  postgres-data:
  redis-data:
  devcontainer-vscode-extensions:
  devcontainer-maven-cache:
  devcontainer-npm-cache:
  devcontainer-claude-config:
  devcontainer-gemini-config:
  devcontainer-codex-config:
  devcontainer-gh-config:
